name: leadflow
description: "LeadFlow - Premium Lead Management System for MBBS Admissions"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Backend
  supabase_flutter: ^1.10.0

  # UI - Essential Only
  flutter_animate: ^4.2.0
  lottie: ^2.4.0
  google_fonts: ^6.1.0

  # Utils
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  logger: ^2.1.0
  uuid: ^4.0.0

  # Networking
  dio: ^5.3.1
  http: ^1.1.0
  socket_io_client: ^2.0.0

  # Storage
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Multimedia
  image_picker: ^0.8.9
  permission_handler: ^11.0.0

  # Analytics
  firebase_core: ^2.24.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
