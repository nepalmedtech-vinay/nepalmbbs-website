name: leadflow
description: "Premium Lead Lifecycle Management System - Indian Market Ready"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  hooks_riverpod: ^2.4.0

  # Supabase Integration
  supabase_flutter: ^1.10.0
  supabase: ^1.10.0

  # UI & Design - PREMIUM LIBRARIES
  flutter_animate: ^4.2.0  # Cinematic animations
  motion: ^1.0.0  # Smooth motion library
  rive: ^0.11.0  # Premium graphics & animations
  lottie: ^2.4.0  # Lottie animations
  google_fonts: ^6.1.0  # Premium fonts
  flutter_staggered_grid_view: ^0.7.0  # Dynamic grid layouts
  glassmorphism: ^3.0.0  # Frosted glass effect
  smooth_page_indicator: ^1.1.0  # Smooth indicators

  # Material & Design
  flutter_material_color_picker: ^1.2.7
  simple_shadow: ^0.3.4
  uuid: ^4.0.0

  # Real-time Communication
  socket_io_client: ^2.0.0
  web_socket_channel: ^2.4.0

  # Database & Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0

  # Networking
  dio: ^5.3.1
  http: ^1.1.0

  # Multimedia
  video_player: ^2.7.0
  image_picker: ^1.0.4
  camera: ^0.10.5
  permission_handler: ^11.4.3

  # AI/ML Integration
  google_mlkit_text_recognition: ^0.8.1  # OCR for documents
  google_mlkit_entity_extraction: ^0.8.1

  # Audio & Speech
  record: ^4.4.4
  flutter_sound: ^9.2.13
  speech_to_text: ^6.4.0

  # Analytics & Monitoring
  firebase_core: ^2.24.0
  firebase_analytics: ^10.7.0
  firebase_messaging: ^14.7.0
  sentry_flutter: ^7.8.0

  # Utils
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  retrofit: ^4.1.0
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Light.ttf
          weight: 300
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
