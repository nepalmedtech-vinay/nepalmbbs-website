# NOT ACTIVE UNTIL DEPLOYED.
#
# This file only takes effect once the repository is connected to a Netlify
# site. The live nepalmbbs.in deploy has not been switched to it — see
# docs/DEPLOYMENT.md for the preview-first sequence.
#
# A netlify.toml overrides settings configured in the Netlify UI. Check the
# existing site's build settings before connecting this repository, so nothing
# configured there is silently replaced.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Caching ──────────────────────────────────────────────────────────────
# Two different policies, because there are two kinds of asset here.
#
# /_assets/* is emitted by Astro with a content hash in the filename, so a
# changed file gets a new URL and can safely be cached forever.
#
# /assets/* is the hand-maintained CSS and JS carried over from the static
# build. Those filenames are stable, so a long max-age would strand visitors
# on an old stylesheet after every deploy — the same class of bug as the stray
# root service worker fixed in Phase 0. They must revalidate.

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# sw.js must never be cached: it is the self-unregistering worker that flushes
# visitors stranded by the old root-scope registration. A cached copy of the
# previous worker would keep serving them stale content.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers ─────────────────────────────────────────────────────
# The Content-Security-Policy that used to be missing here is now generated
# below by tools/gen-csp.mjs, because two of its directives depend on the build
# output. Every inline on* handler outside the two tracker apps has been
# converted to a delegated listener, so script-src carries no 'unsafe-inline'.
# style-src still does: 153 inline style attributes remain, and style injection
# is a much weaker vector than script injection.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# >>> generated by tools/gen-csp.mjs — do not edit by hand
# 3 inline script hash(es); regenerate after any build that
# changes an inline <script>. `node tools/gen-csp.mjs --check` fails if stale.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-SdEF7thq6rQilRLiTvXSF8C0gZzbseToEpnhgT3dJCQ=' 'sha256-oTiYrUQ4FTU7PbAd0T/9h6zOGI7xTDomqg3/eBmdeRY=' 'sha256-sxMTacUw9Y0fl3Xs7+aDNhpUJOuJgHMHBjU9vUzpMgk=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://img.youtube.com https://i.ytimg.com https://www.googletagmanager.com; connect-src 'self' https://fpzgcijbryvddtpegcmm.supabase.co https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; upgrade-insecure-requests"

[[headers]]
  for = "/wrc-tracker/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://api.anthropic.com https://api.openai.com https://api.whatsapp.com https://cdnjs.cloudflare.com https://generativelanguage.googleapis.com https://tgsiltcuisgejmdkovxz.supabase.co https://wa.me; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.anthropic.com https://api.openai.com https://api.whatsapp.com https://cdnjs.cloudflare.com https://generativelanguage.googleapis.com https://tgsiltcuisgejmdkovxz.supabase.co https://wa.me"

[[headers]]
  for = "/cmc-tracker/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://api.anthropic.com https://api.openai.com https://api.whatsapp.com https://cdnjs.cloudflare.com https://generativelanguage.googleapis.com https://tgsiltcuisgejmdkovxz.supabase.co https://wa.me; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.anthropic.com https://api.openai.com https://api.whatsapp.com https://cdnjs.cloudflare.com https://generativelanguage.googleapis.com https://tgsiltcuisgejmdkovxz.supabase.co https://wa.me"

# The student portal reaches the application by a token in the URL. Without
# this, following any outbound link from that page hands the token to the other
# site in the Referer header, and a token in someone's analytics is a token
# they have.
[[headers]]
  for = "/portal/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

# The console has no token in its URL, so the default Referrer-Policy is fine.
# It is still not public content.
[[headers]]
  for = "/staff/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
